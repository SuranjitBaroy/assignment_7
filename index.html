<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeenKeeper - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" />
</head>
<body class="bg-white min-h-screen flex flex-col">

    <!-- Navbar (Requirement 1) -->
    <nav class="flex justify-between items-center p-5 bg-white border-b sticky top-0 z-50">
        <div class="text-2xl font-bold text-emerald-900">KeenKeeper</div>
        <div class="flex gap-6">
            <a href="index.html" class="flex items-center gap-2 font-medium text-emerald-700 border-b-2 border-emerald-700 pb-1">Home</a>
            <a href="timeline.html" class="flex items-center gap-2 font-medium text-gray-500">Timeline</a>
            <a href="stats.html" class="flex items-center gap-2 font-medium text-gray-500">Stats</a>
        </div>
    </nav>

    <!-- Banner (Requirement 2) -->
    <div class="max-w-7xl mx-auto px-4 text-center py-16">
        <h1 class="text-4xl font-bold">Friends to keep close in your life</h1>
        <p class="text-gray-500 mt-2">Manage your relationships easily.</p>
        <button class="btn bg-emerald-800 text-white mt-8 px-8 border-none hover:bg-emerald-950">+ Add a Friend</button>
    </div>

    <!-- Summary Cards -->
    <div class="max-w-7xl mx-auto px-4 grid grid-cols-2 md:grid-cols-4 gap-4 mb-12 w-full">
        <div class="card border p-6 text-center shadow-sm"><strong>12</strong><p class="text-[10px] text-gray-400 uppercase">Total Friends</p></div>
        <div class="card border p-6 text-center shadow-sm"><strong>8</strong><p class="text-[10px] text-gray-400 uppercase">On Track</p></div>
        <div class="card border p-6 text-center shadow-sm"><strong>3</strong><p class="text-[10px] text-gray-400 uppercase">Overdue</p></div>
        <div class="card border p-6 text-center shadow-sm"><strong>1</strong><p class="text-[10px] text-gray-400 uppercase">Snoozed</p></div>
    </div>

    <!-- Your Friends Grid (Requirement 4) -->
    <div class="max-w-7xl mx-auto px-4 mb-20 w-full">
        <h2 class="text-xl font-bold mb-6">Your Friends</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Friend Card Linking to Details -->
            <a href="details.html" class="card border p-6 text-center hover:shadow-lg transition">
                <img src="https://i.pravatar.cc/150?u=1" class="w-20 h-20 rounded-full mx-auto mb-4 border-2 border-emerald-50" />
                <h3 class="font-bold">Alex Johnson</h3>
                <p class="text-xs text-gray-400">5 Days ago</p>
                <div class="flex gap-1 justify-center my-3">
                    <span class="badge badge-ghost text-[10px]">COLLEGE</span>
                    <span class="badge badge-ghost text-[10px]">WORK</span>
                </div>
                <div class="bg-green-100 text-green-700 py-1 rounded text-xs font-bold uppercase">Active</div>
            </a>
        </div>
    </div>

    <!-- Footer (Requirement 8) -->
    <footer class="bg-emerald-950 text-white py-12 text-center mt-auto">
        <h2 class="text-2xl font-bold mb-4">KeenKeeper</h2>
        <p class="text-gray-400 text-xs">© 2026 KeenKeeper. All rights reserved.</p>
    </footer>

</body>
</html>
