<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats - KeenKeeper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" />
</head>
<body class="bg-white min-h-screen flex flex-col">

    <nav class="flex justify-between items-center p-5 bg-white border-b">
        <div class="text-2xl font-bold text-emerald-900">KeenKeeper</div>
        <div class="flex gap-6">
            <a href="index.html" class="text-gray-500">Home</a>
            <a href="timeline.html" class="text-gray-500">Timeline</a>
            <a href="stats.html" class="font-medium text-emerald-700 border-b-2 border-emerald-700 pb-1">Stats</a>
        </div>
    </nav>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full">
        <h1 class="text-3xl font-bold text-center mb-10">Friendship Analytics</h1>
        <div class="card border p-12 bg-white flex flex-col items-center">
            <div class="w-56 h-56 rounded-full border-[12px] border-emerald-600 border-t-red-400 border-l-orange-300 flex items-center justify-center">
                <div class="text-center font-bold">75%<br><span class="text-[10px] text-gray-400">ON TRACK</span></div>
            </div>
            <div class="flex gap-4 mt-8">
                <span class="badge badge-success badge-sm">On Track</span>
                <span class="badge badge-error badge-sm">Overdue</span>
            </div>
        </div>
    </main>

    <footer class="bg-emerald-950 text-white py-8 text-center px-4">
        <p class="text-xs text-gray-500">© 2026 KeenKeeper</p>
    </footer>

</body>
</html>
